[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-network-experiment"
version = "1.0.0"
description = "Falsifiable multi-channel experiment for detecting structured modulation in pulsar data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "h5py>=3.10",
  "PyYAML>=6.0",
  "hdf5plugin>=4.4",
]

[project.optional-dependencies]
psrfits = ["astropy>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pulsarnet = "pulsarnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
