[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-network-experiment"
version = "1.0.1"
description = "Falsifiable multi-channel experiment for detecting structured modulation in pulsar data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "h5py>=3.10",
  "PyYAML>=6.0",
  "hdf5plugin>=4.4",
]

[project.optional-dependencies]
psrfits = ["astropy>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pulsarnet = "pulsarnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff defaults (pyflakes + the safe pycodestyle subset). Line length is not gated:
# the analysis code carries long numeric literals and registered constants.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
