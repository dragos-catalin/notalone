name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "paper/**", "artifacts/**", "CITATION.cff"]
  schedule:
    - cron: "17 3 * * 1" # weekly: full-history secret scan + fresh CVE data
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    uses: dragos-catalin/workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      extras: dev
  security:
    uses: dragos-catalin/workflows/.github/workflows/security.yml@v1
    with:
      full-history: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
